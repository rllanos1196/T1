<div class="card border-0 shadow-sm h-100">
  <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
    <span class="fw-semibold">NuevoMovimientoComponent</span>
    <span class="badge text-bg-light">HIJO</span>
  </div>
  <div class="card-body">
    <form (submit)="registrar($event)" novalidate>
      <div class="mb-3">
        <label class="form-label small" for="tipo">Tipo de movimiento</label>
        <select class="form-select" id="tipo" [value]="tipo" (change)="onTipoChange($event)">
          <option value="Recarga">Recarga</option>
          <option value="Gasto">Gasto</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label small" for="monto">Monto (S/)</label>
        <input class="form-control" id="monto" name="monto" type="text" inputmode="decimal"
               placeholder="0.00" [value]="montoTexto" (input)="onMontoInput($event)">
      </div>

      <!-- Validación en tiempo real del monto (@if) -->
      @if (montoTexto.trim() !== '' && !montoValido) {
        <div class="alert alert-warning py-2" role="alert">
          Ingrese un monto numérico mayor a cero.
        </div>
      }

      <!-- Saldo insuficiente (@if) -->
      @if (saldoInsuficiente) {
        <div class="alert alert-danger py-2" role="alert">
          Saldo insuficiente para realizar el gasto
        </div>
      }

      <!-- [disabled] impide emitir una solicitud inválida -->
      <div class="d-grid">
        <button type="submit" class="btn btn-primary" [disabled]="!formularioValido">
          Registrar movimiento
        </button>
      </div>
      <div class="form-text">

      </div>
    </form>
  </div>
</div>
